[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "his-ai-assistant"
version = "0.1.0"
description = "HIS Knowledge Base (his-kb) & 7-Step BA/QC/Dev AI Workflow Assistant for Team 315"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "typer>=0.12.0",
    "sqlalchemy>=2.0.29",
    "alembic>=1.13.1",
    "pgvector>=0.2.5",
    "psycopg[binary]>=3.1.18",
    "pypdf>=4.2.0",
    "python-docx>=1.1.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.6",
    "ruff>=0.4.0",
]

[project.scripts]
his-kb = "app.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "sample_data*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["sample_data/his_staging"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]
